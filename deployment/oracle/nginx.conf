# Nginx configuration for Oracle frontend with API proxy to Volknode

upstream volknode_api {
    server 87.251.66.181:8003;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name data-validator.wolfgroupindia.com;
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name data-validator.wolfgroupindia.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/data-validator.wolfgroupindia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data-validator.wolfgroupindia.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Serve static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Volknode backend
    location /api/ {
        proxy_pass http://volknode_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for long-running validation requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
