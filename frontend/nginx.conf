server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Larger body limit for CSV/XLSX uploads (100 MB)
    client_max_body_size 100M;

    # ── API proxy → Volknode backend (87.251.66.181:8003) ──────────────────
    # Long timeouts required: bulk SMTP verification takes minutes per job
    location /api/ {
        proxy_pass         http://87.251.66.181:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Timeouts — must be longer than the longest API response
        proxy_connect_timeout   30s;
        proxy_send_timeout      600s;   # 10 min — for large CSV uploads
        proxy_read_timeout      600s;   # 10 min — for deep single validation
        send_timeout            600s;
    }

    # Serve React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
